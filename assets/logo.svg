<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" role="img" aria-label="Al Ababeel Afghan Restaurant">
  <defs>
    <linearGradient id="lgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5a3"/>
      <stop offset=".45" stop-color="#cfa858"/>
      <stop offset="1" stop-color="#9a7733"/>
    </linearGradient>
    <linearGradient id="lgTri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23d183" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#b23a3a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e0c078" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="lgPlate" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#191b19"/>
      <stop offset=".72" stop-color="#101211"/>
      <stop offset="1" stop-color="#0a0b0b"/>
    </radialGradient>
  </defs>

  <!-- emblem plate -->
  <circle cx="48" cy="48" r="46" fill="url(#lgPlate)"/>
  <circle cx="48" cy="48" r="42.5" fill="none" stroke="url(#lgGold)" stroke-width="1.6"/>
  <!-- wheat wreath ring -->
  <circle cx="48" cy="48" r="35.5" fill="none" stroke="#b98f43" stroke-width="2.4" stroke-dasharray="2.6 6.4" stroke-linecap="round" opacity=".9"/>
  <g stroke="#d8b264" stroke-width="1.6" stroke-linecap="round" opacity=".9">
    <path d="M48 13.6v5" transform="rotate(0 48 48)"/>
    <path d="M48 13.6v5" transform="rotate(42 48 48)"/>
    <path d="M48 13.6v5" transform="rotate(-42 48 48)"/>
    <path d="M48 13.6v5" transform="rotate(138 48 48)"/>
    <path d="M48 13.6v5" transform="rotate(-138 48 48)"/>
  </g>

  <!-- swallows (ababeel) -->
  <g fill="none" stroke="url(#lgGold)" stroke-width="2" stroke-linecap="round">
    <path d="M33 22 C36 15.5 42 15.5 45 22 C42 20.5 40.5 18.5 39 18.5 C37.5 18.5 36 20.5 33 22 Z" fill="#e9d5a3" stroke="none"/>
    <path d="M52 17 C54 12.5 58.5 12.5 60.5 17 C58.5 16 57.5 14.5 56.2 14.5 C55 14.5 54 16 52 17 Z" fill="#cfa858" stroke="none"/>
  </g>

  <!-- pennants -->
  <g stroke="#cfa858" stroke-width="1.8" stroke-linecap="round">
    <path d="M25.5 34v26"/>
    <path d="M70.5 34v26"/>
  </g>
  <path d="M25.5 34 L18 38.5 L25.5 43 Z" fill="#e9d5a3"/>
  <path d="M70.5 34 L78 38.5 L70.5 43 Z" fill="#e9d5a3"/>

  <!-- mihrab gate + minbar -->
  <path d="M33 62 V46 Q33 31.5 48 25.5 Q63 31.5 63 46 V62" fill="none" stroke="url(#lgGold)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M38 62 V47 Q38 36.5 48 32.5 Q58 36.5 58 47 V62" fill="rgba(233,213,163,.16)" stroke="#e9d5a3" stroke-width="1.4"/>
  <g fill="#cfa858">
    <rect x="63.5" y="56" width="7" height="3.4" rx=".8"/>
    <rect x="63.5" y="50.5" width="7" height="3.4" rx=".8"/>
    <rect x="63.5" y="45" width="7" height="3.4" rx=".8"/>
  </g>
  <!-- ground -->
  <path d="M23 62 H73" stroke="#d8b264" stroke-width="1.8" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="112" y="42" font-family="Cinzel, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="4.5" fill="#ecd9a8">AL ABABEEL</text>
  <text x="113" y="62" font-family="Jost, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" letter-spacing="5.2" fill="#a7946a">AFGHAN RESTAURANT</text>
  <text x="113" y="78" font-family="Amiri, serif" font-size="13" fill="#8f7d55">الابابيل · دبي</text>
  <rect x="112" y="70.5" width="150" height="1.6" fill="url(#lgTri)"/>
</svg>
